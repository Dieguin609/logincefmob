<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css"> <!-- Mantenha o seu arquivo style.css original -->
    <style>
        /* Correção para os campos novos no seu painel */
        .sidebar { overflow-y: auto !important; }
        .input-padrao { width: 100%; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid #333; color: white; margin-bottom: 10px; border-radius: 4px; }
        .preview-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .preview-img-box { width: 100%; aspect-ratio: 1; background: #222; border: 2px solid #333; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .preview-img-box.active { border-color: var(--primary); }
    </style>
</head>
<body>
    <!-- ... Mantenha o fundo e a tela de login como estão no seu style.css ... -->

    <div id="creation-screen" style="display: flex;"> <!-- Forçado para testar -->
        <aside class="creation-sidebar">
            <h1>CRIAR<span>CIDADÃO</span></h1>

            <!-- Nome e Senha -->
            <div class="section">
                <p>Nome do Personagem</p>
                <input type="text" id="char-name" class="input-padrao" placeholder="Nome_Sobrenome">
            </div>
            <div class="section">
                <p>Defina sua Senha</p>
                <input type="password" id="char-pass" class="input-padrao" placeholder="Senha secreta...">
            </div>

            <!-- Gênero e Pele -->
            <div class="section">
                <p>Gênero Base</p>
                <div class="grid-options">
                    <div id="m-btn" class="box-opt active" onclick="setGender('M', 58)"><i class="fas fa-mars"></i> MASC</div>
                    <div id="f-btn" class="box-opt" onclick="setGender('F', 184)"><i class="fas fa-venus"></i> FEM</div>
                </div>
            </div>

            <div class="section">
                <p>Tom de Pele</p>
                <div class="grid-options">
                    <div id="pele-1" class="box-opt active" style="background: #ffdbac;" onclick="setSkin(1)"></div>
                    <div id="pele-2" class="box-opt" style="background: #8d5524;" onclick="setSkin(2)"></div>
                </div>
            </div>

            <!-- Grid de Estilos (Barba/Cabelo) -->
            <div class="section">
                <p>Estilo (Barba/Cabelo)</p>
                <div class="preview-grid">
                    <div class="preview-img-box active" onclick="setEstilo(1, this)"><i class="fas fa-user"></i></div>
                    <div class="preview-img-box" onclick="setEstilo(2, this)"><i class="fas fa-user"></i></div>
                </div>
            </div>

            <button class="btn-flutuante" onclick="finalizar()">INICIAR JORNADA</button>
        </aside>
    </div>

    <script src="script.js"></script> <!-- Linkado com seu script_3.js -->
</body>
</html>
